services:
  # GitForge Application
  gitforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: gitforge:latest
    container_name: gitforge-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gitforge}:${POSTGRES_PASSWORD:-gitforge_secret_password}@postgres:5432/${POSTGRES_DB:-gitforge_db}?sslmode=disable
      - APP_URL=${APP_URL:-http://localhost:3000}
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID:-}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET:-}
      - CLOUDFLARE_OAUTH_SCOPES=${CLOUDFLARE_OAUTH_SCOPES:-account:read pages:edit dns:edit}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Dedicated Local PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: gitforge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitforge_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-gitforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitforge} -d ${POSTGRES_DB:-gitforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
